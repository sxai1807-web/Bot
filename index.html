<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="color-scheme" content="dark">
  <title>Order keypad</title>
  <!-- Telegram's Mini App script: it hands the order to the bot. -->
  <script src="https://telegram.org/js/telegram-web-app.js?63"></script>
  <!-- What the keys do. tests/keypad.test.js runs this block, so keep it free of page code. -->
  <script id="keypad-logic">
    (function (root) {
      "use strict";

      // An order is a list of lines, one of which is current: the keys type at the end of it. Every change
      // makes a new {lines, current} rather than altering the old one.

      // Keys that type themselves. D has no key of its own (every order starts with it), but a computer's
      // keyboard can still type it.
      var TYPED_KEYS = "0123456789D*#+";

      // A new order: D (today) on line 1, and the # that starts the company line on line 2, where typing
      // carries on. Keep in step with NEW_ORDER in keyboards.py.
      var NEW_ORDER = "D\n#";

      function newOrder() {
        var lines = NEW_ORDER.split("\n");
        return { lines: lines, current: lines.length - 1 };
      }

      function trim(line) {
        return line.trim();
      }

      // Tap `key`: a typed key adds to the current line; "del" deletes its last character (on an empty line,
      // the line itself); "enter" starts a new line below it (never a second empty one); "clear" starts a
      // new order.
      function press(order, key) {
        var lines = order.lines.slice();
        var current = order.current;
        var line = lines[current];
        if (key.length === 1 && TYPED_KEYS.indexOf(key) !== -1) {
          lines[current] = line + key;
          return { lines: lines, current: current };
        }
        if (key === "del") {
          if (line) {
            lines[current] = line.slice(0, -1);
            return { lines: lines, current: current };
          }
          if (lines.length === 1) return order;
          lines.splice(current, 1);
          return { lines: lines, current: Math.max(0, current - 1) };
        }
        if (key === "enter") {
          if (!line) return order;
          lines.splice(current + 1, 0, "");
          return { lines: lines, current: current + 1 };
        }
        if (key === "clear") return newOrder();
        return order;
      }

      // Tap line `index` to type there. Leaving an empty line removes it; tapping below the last line starts a
      // new one there.
      function select(order, index) {
        var lines = order.lines.slice();
        var current = order.current;
        index = Math.max(0, index);
        if (index === current) return order;
        if (lines[current] === "" && lines.length > 1) {
          lines.splice(current, 1);
          if (index > current) index -= 1;
        }
        if (index < lines.length) return { lines: lines, current: index };
        var last = lines.length - 1;
        if (lines[last] === "") return { lines: lines, current: last };
        return { lines: lines.concat([""]), current: lines.length };
      }

      function isNew(order) {
        return order.lines.join("\n") === NEW_ORDER;
      }

      function isDateLine(line) {
        return line === "D" || /^\d{1,2}$/.test(line);
      }

      // Paste `text`, one line per line. Into a new order, a pasted order that starts with its date (D, or a
      // day like 30) replaces it; anything else follows the D, in place of the # waiting on line 2. Otherwise
      // the pasted lines go below the current line, or in its place if it's empty.
      function paste(order, text) {
        var pasted = text.split(/\r\n|\r|\n/).map(trim).filter(Boolean);
        if (!pasted.length) return order;
        var lines = order.lines.slice();
        var at, replace;
        if (isNew(order)) {
          at = isDateLine(pasted[0]) ? 0 : 1;
          replace = lines.length - at;
        } else if (lines[order.current] === "") {
          at = order.current;
          replace = 1;
        } else {
          at = order.current + 1;
          replace = 0;
        }
        lines.splice.apply(lines, [at, replace].concat(pasted));
        return { lines: lines, current: at + pasted.length - 1 };
      }

      // The lines as they are sent to the bot: without blank lines, stray spaces, or a # left on its own.
      function orderLines(lines) {
        return lines.map(trim).filter(function (line) { return line && line !== "#"; });
      }

      // True when there's something to send beyond the D a new order starts with.
      function hasOrder(order) {
        return orderLines(order.lines).some(function (line) { return line !== "D"; });
      }

      var keypad = {
        NEW_ORDER: NEW_ORDER,
        newOrder: newOrder,
        press: press,
        select: select,
        paste: paste,
        orderLines: orderLines,
        hasOrder: hasOrder
      };
      if (typeof module === "object" && module.exports) {
        module.exports = keypad;
      } else {
        root.Keypad = keypad;
      }
    })(this);
  </script>
  <style>
    :root {
      --bg: #161616;
      --list-bg: #1e1e1e;
      --separator: #2c2c2c;
      --current: #050505;       /* the line being typed on */
      --number: #8e8e8e;
      --text: #ffffff;
      --key: #2a2a2a;
      --key-pressed: #3b3b3b;
      --paste: #2b2b2b;
      --clear: #e39c9c;
      --submit: #74c69d;
      --hash: #b9a7ff;
      --row-height: 36px;
      --key-height: clamp(44px, 7.4vh, 56px);
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html,
    body {
      height: 100%;
      margin: 0;
      background: var(--bg);
      color: var(--text);
    }

    body {
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      overscroll-behavior: none;
      user-select: none;
      -webkit-user-select: none;
      -webkit-touch-callout: none;
    }

    button {
      font: inherit;
      touch-action: manipulation;
    }

    button:focus {
      outline: none;
    }

    button:focus-visible {
      outline: 2px solid var(--hash);
      outline-offset: -2px;
    }

    /* The page's own height, which shrinks while the phone's keyboard is open and grows back when it closes.
       (Not Telegram's --tg-viewport-stable-height: on Android that can stay at the keyboard-open height after the
       keyboard closes, squashing the keypad to the top.) */
    .app {
      display: flex;
      flex-direction: column;
      height: 100%;
    }

    /* The order, one numbered line per bet line. */
    .lines {
      flex: 1;
      min-height: calc(var(--row-height) * 3);
      overflow-y: auto;
      overscroll-behavior: contain;
      background: var(--list-bg);
    }

    .line {
      display: flex;
      align-items: center;
      height: var(--row-height);
      padding: 0 14px;
      border-bottom: 1px solid var(--separator);
      cursor: pointer;
    }

    .line.current {
      background: var(--current);
    }

    .number {
      flex: none;
      width: 28px;
      color: var(--number);
      font-size: 14px;
    }

    .text {
      overflow: hidden;
      font-size: 19px;
      white-space: pre;
      text-overflow: ellipsis;
    }

    /* PASTE and CLEAR. */
    .tools {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 6px;
      padding: 8px 6px 6px;
    }

    .tool {
      height: 28px;
      border: 0;
      border-radius: 3px;
      font-size: 12px;
      font-weight: 600;
      letter-spacing: 0.08em;
    }

    /* PASTE is really a text box, so holding it brings up the phone's own Paste. Its label is the box's
       placeholder; it never shows a keyboard (inputmode="none") or anything typed into it. */
    .tool.paste {
      display: block;
      width: 100%;
      margin: 0;
      padding: 6px 0 0;
      overflow: hidden;
      resize: none;
      outline: none;
      background: var(--paste);
      color: transparent;
      caret-color: transparent;
      font-family: inherit;
      line-height: 16px;
      text-align: center;
      user-select: text;
      -webkit-user-select: text;
      -webkit-touch-callout: default;
    }

    .tool.paste::placeholder {
      color: #d4d4d4;
      opacity: 1;
    }

    .tool.clear {
      background: var(--clear);
      color: #ffffff;
    }

    .tool:active {
      filter: brightness(1.2);
    }

    /* The keys. */
    .keys {
      display: grid;
      gap: 6px;
      padding: 0 6px calc(8px + var(--tg-safe-area-inset-bottom, 0px));
    }

    .key-row {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 6px;
      height: var(--key-height);
    }

    .key-row.last {
      grid-template-columns: 1fr 1fr 1fr 2fr;
    }

    .key {
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 0;
      border: 0;
      border-radius: 4px;
      background: var(--key);
      color: var(--text);
      font-size: 21px;
    }

    .key:active:not(:disabled) {
      background: var(--key-pressed);
    }

    .key.hash {
      color: var(--hash);
      font-size: 23px;
    }

    .key.submit {
      background: var(--submit);
      font-size: 19px;
      font-weight: 600;
      letter-spacing: 0.06em;
    }

    .key.submit:active:not(:disabled) {
      background: var(--submit);
      filter: brightness(1.1);
    }

    .key.submit:disabled {
      opacity: 0.45;
    }

    .key svg {
      width: 25px;
      height: 25px;
      fill: none;
      stroke: currentColor;
      stroke-width: 1.8;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .toast {
      position: fixed;
      right: 16px;
      bottom: 72px;
      left: 16px;
      padding: 12px 14px;
      border-radius: 10px;
      background: #2a2a2a;
      font-size: 15px;
      line-height: 1.4;
      white-space: pre-wrap;
      box-shadow: 0 6px 24px rgba(0, 0, 0, 0.6);
      pointer-events: none; /* taps go through to the keys below */
    }

    .toast[hidden] {
      display: none;
    }
  </style>
</head>
<body>
  <main class="app">
    <div class="lines" id="lines" role="list" aria-label="Order"></div>

    <div class="tools">
      <textarea class="tool paste" id="paste" rows="1" data-action="paste" data-placeholder="paste" aria-label="Paste"
        placeholder="PASTE" inputmode="none" autocomplete="off" autocorrect="off" autocapitalize="off"
        spellcheck="false"></textarea>
      <button type="button" class="tool clear" data-key="clear" data-label="clear">CLEAR</button>
    </div>

    <div class="keys">
      <div class="key-row">
        <button type="button" class="key" data-key="1">1</button>
        <button type="button" class="key" data-key="2">2</button>
        <button type="button" class="key" data-key="3">3</button>
        <button type="button" class="key" data-key="del" data-aria="del" aria-label="Delete">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M21 5H9l-6 7 6 7h12a1 1 0 0 0 1-1V6a1 1 0 0 0-1-1z"/><path d="M17.5 9.5l-5 5M12.5 9.5l5 5"/></svg>
        </button>
      </div>
      <div class="key-row">
        <button type="button" class="key" data-key="4">4</button>
        <button type="button" class="key" data-key="5">5</button>
        <button type="button" class="key" data-key="6">6</button>
        <button type="button" class="key" data-key="+">+</button>
      </div>
      <div class="key-row">
        <button type="button" class="key" data-key="7">7</button>
        <button type="button" class="key" data-key="8">8</button>
        <button type="button" class="key" data-key="9">9</button>
        <button type="button" class="key" data-key="enter" data-aria="enter" aria-label="New line">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M19 6v5a3 3 0 0 1-3 3H6"/><path d="M9.5 10.5L6 14l3.5 3.5"/></svg>
        </button>
      </div>
      <div class="key-row last">
        <button type="button" class="key" data-key="*">*</button>
        <button type="button" class="key" data-key="0">0</button>
        <button type="button" class="key hash" data-key="#">#</button>
        <button type="button" class="key submit" id="submit" data-action="submit" data-label="submit" disabled>SUBMIT</button>
      </div>
    </div>
  </main>

  <div class="toast" id="toast" role="status" hidden></div>

  <script>
    (function () {
      "use strict";

      var tg = window.Telegram && window.Telegram.WebApp;
      var inTelegram = Boolean(tg && tg.platform && tg.platform !== "unknown");
      var android = inTelegram && /^android/.test(tg.platform);

      // The bot opens this page with ?lang=en|zh.
      var lang = new URLSearchParams(location.search).get("lang") === "zh" ? "zh" : "en";

      // Telegram hands the bot at most 4096 bytes, and every key types plain ASCII.
      var MAX_LENGTH = 4096;

      var TEXT = {
        en: {
          paste: "PASTE",
          clear: "CLEAR",
          submit: "SUBMIT",
          del: "Delete",
          enter: "New line",
          pasteTip: "To paste here, press and hold PASTE, then tap Paste.",
          keyboardTip: "Tap your copied text above the keyboard to paste it (or use your keyboard's clipboard button).",
          preview: "Preview only. In Telegram this would send:"
        },
        zh: {
          paste: "粘贴",
          clear: "清除",
          submit: "提交",
          del: "删除",
          enter: "换行",
          pasteTip: "要粘贴，请按住「粘贴」键，然后点选「粘贴」。",
          keyboardTip: "点键盘上方显示的复制内容即可粘贴（或用键盘的剪贴板按钮）。",
          preview: "仅为预览。在 Telegram 中将发送："
        }
      }[lang];

      var linesEl = document.getElementById("lines");
      var submitButton = document.getElementById("submit");
      var pasteEl = document.getElementById("paste");
      var toast = document.getElementById("toast");
      var rowHeight = parseFloat(getComputedStyle(document.documentElement).getPropertyValue("--row-height")) || 36;

      var order = Keypad.newOrder();
      var wasReady = null;

      document.documentElement.lang = lang === "zh" ? "zh-Hans" : "en";
      document.querySelectorAll("[data-label]").forEach(function (el) {
        el.textContent = TEXT[el.dataset.label];
      });
      document.querySelectorAll("[data-aria]").forEach(function (el) {
        el.setAttribute("aria-label", TEXT[el.dataset.aria]);
      });
      document.querySelectorAll("[data-placeholder]").forEach(function (el) {
        el.placeholder = TEXT[el.dataset.placeholder];
      });

      function supports(version) {
        return inTelegram && tg.isVersionAtLeast(version);
      }

      function buzz(kind) {
        if (!supports("6.1")) return;
        if (kind === "error") tg.HapticFeedback.notificationOccurred("error");
        else tg.HapticFeedback.impactOccurred("light");
      }

      // Draw the order: its lines, then empty numbered lines down to the bottom of the list, with the current
      // line marked and kept in view (so a long order shows the line being typed on, usually its last).
      function render() {
        var visible = Math.floor(linesEl.clientHeight / rowHeight);
        var count = Math.max(order.lines.length, visible);
        var current = null;
        linesEl.textContent = "";
        for (var i = 0; i < count; i++) {
          var row = document.createElement("div");
          row.className = "line";
          row.setAttribute("role", "listitem");
          row.dataset.index = String(i);
          var number = document.createElement("span");
          number.className = "number";
          number.textContent = i + 1 + ".";
          var text = document.createElement("span");
          text.className = "text";
          text.textContent = i < order.lines.length ? order.lines[i] : "";
          row.appendChild(number);
          row.appendChild(text);
          if (i === order.current) {
            row.classList.add("current");
            current = row;
          }
          linesEl.appendChild(row);
        }
        if (current) current.scrollIntoView({ block: "nearest" });
        updateSubmit();
      }

      // SUBMIT is on only when there's more than the D a new order starts with.
      function updateSubmit() {
        var ready = Keypad.hasOrder(order);
        if (ready === wasReady) return;
        wasReady = ready;
        submitButton.disabled = !ready;
        // Ask before closing the keypad while there's an order that hasn't been sent.
        if (supports("6.2")) {
          if (ready) tg.enableClosingConfirmation();
          else tg.disableClosingConfirmation();
        }
      }

      function change(next) {
        if (next.lines.join("\n").length > MAX_LENGTH) {
          buzz("error"); // more than Telegram can carry
          return;
        }
        order = next;
        render();
      }

      function tap(key) {
        if (pasteMode) endPasteMode();
        buzz("tap");
        change(Keypad.press(order, key));
      }

      function pasteText(text) {
        change(Keypad.paste(order, text));
      }

      // A tap on PASTE reads the clipboard where the phone allows it: an iPhone shows a small Paste bubble to tap.
      // Telegram on Android never lets a page read it, so there the tap opens the phone's keyboard instead, whose
      // copied-text suggestion (or clipboard button) pastes into the PASTE box. Holding PASTE and tapping the
      // phone's own Paste works everywhere too; the "paste" handler below takes that.
      function pasteFromClipboard() {
        if (android || !navigator.clipboard || !navigator.clipboard.readText) {
          openKeyboardToPaste();
          return;
        }
        navigator.clipboard.readText().then(
          function (text) {
            if (!text) {
              showToast(TEXT.pasteTip);
              return;
            }
            pasteEl.blur();
            pasteText(text);
          },
          function () {
            showToast(TEXT.pasteTip);
          }
        );
      }

      // True while the phone's keyboard is open on the PASTE box, so what it puts there counts as a paste.
      var pasteMode = false;

      function openKeyboardToPaste() {
        pasteEl.blur();
        pasteMode = true;
        pasteEl.inputMode = "text";
        pasteEl.focus();
        showToast(TEXT.keyboardTip);
      }

      function endPasteMode() {
        clearTimeout(pasteTimer);
        pasteMode = false;
        pasteEl.inputMode = "none";
        pasteEl.value = "";
        if (document.activeElement === pasteEl) pasteEl.blur(); // closes the keyboard
      }

      pasteEl.addEventListener("blur", function () {
        if (pasteMode) endPasteMode();
      });

      // Text that lands in the PASTE box (from the keyboard, or a paste that skipped the "paste" handler), in one go
      // or in steps: wait for it to settle, then take it all, once. Anything typed there otherwise is dropped.
      var pasteTimer = null;
      pasteEl.addEventListener("input", function (event) {
        if (!pasteMode && !/^insertFromPaste/.test(event.inputType || "")) {
          pasteEl.value = "";
          return;
        }
        clearTimeout(pasteTimer);
        pasteTimer = setTimeout(function () {
          var text = pasteEl.value;
          endPasteMode();
          if (text.trim()) pasteText(text);
        }, 300);
      });

      function submit() {
        if (!Keypad.hasOrder(order)) {
          buzz("error");
          return;
        }
        var data = Keypad.orderLines(order.lines).join("\n");
        if (inTelegram) {
          if (supports("6.2")) tg.disableClosingConfirmation();
          tg.sendData(data); // Telegram closes the keypad and hands the order to the bot
        } else {
          showToast(TEXT.preview + "\n" + data);
        }
      }

      var toastTimer = null;
      function showToast(text) {
        toast.textContent = text;
        toast.hidden = false;
        clearTimeout(toastTimer);
        toastTimer = setTimeout(function () { toast.hidden = true; }, 4000);
      }

      document.addEventListener("click", function (event) {
        var target = event.target.closest("[data-key], [data-action], .line");
        if (!target || target.disabled) return;
        if (target.classList.contains("line")) {
          change(Keypad.select(order, Number(target.dataset.index)));
        } else if (target.dataset.key) {
          tap(target.dataset.key);
        } else if (target.dataset.action === "paste") {
          pasteFromClipboard();
        } else if (target.dataset.action === "submit") {
          submit();
        }
      });

      // Don't let a mouse click focus a key, or Space would press it again.
      document.addEventListener("mousedown", function (event) {
        if (event.target.closest("button")) event.preventDefault();
      });

      // A computer keyboard works too (Telegram Desktop): digits, D * # +, Backspace, Enter for a new line,
      // the arrow keys to move between lines, Ctrl+V to paste and Ctrl+Enter to submit.
      var KEYBOARD = { d: "D", D: "D", Backspace: "del", Enter: "enter" };
      document.addEventListener("keydown", function (event) {
        if (event.key === "Enter" && (event.ctrlKey || event.metaKey)) {
          event.preventDefault();
          submit();
          return;
        }
        if (event.ctrlKey || event.metaKey || event.altKey) return;
        if (event.key === "ArrowUp" || event.key === "ArrowDown") {
          event.preventDefault();
          change(Keypad.select(order, order.current + (event.key === "ArrowUp" ? -1 : 1)));
          return;
        }
        var key = KEYBOARD[event.key] || (/^[0-9*#+]$/.test(event.key) ? event.key : null);
        if (key) {
          event.preventDefault();
          tap(key);
        }
      });

      // Paste: holding PASTE and tapping Paste on a phone, or Ctrl+V on a computer.
      document.addEventListener("paste", function (event) {
        var text = event.clipboardData && event.clipboardData.getData("text");
        if (!text) return; // it lands in the PASTE box instead, whose "input" handler takes it
        event.preventDefault();
        endPasteMode();
        pasteText(text);
      });

      window.addEventListener("resize", render);

      if (inTelegram) {
        tg.MainButton.hide(); // SUBMIT is on the page
        if (supports("6.1")) {
          tg.setHeaderColor("#161616");
          tg.setBackgroundColor("#161616");
        }
        if (supports("7.10")) tg.setBottomBarColor("#161616");
        tg.expand(); // room for the whole keypad
      }

      render();
      if (inTelegram) tg.ready();
    })();
  </script>
</body>
</html>
